<!doctype html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>CoTypeX Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #0e1011; color: #edf1ef; font-family: Inter, system-ui, sans-serif; }
    .shell { display: grid; grid-template-columns: 236px 1fr; width: 100vw; height: 100vh; }
    aside { padding: 18px 14px; border-right: 1px solid #24292a; background: #121516; }
    .logo { margin-bottom: 26px; font-weight: 720; }
    .nav { display: grid; gap: 6px; color: #89918f; font-size: 13px; }
    .nav div { padding: 8px 10px; border-radius: 6px; }
    .nav .active { background: #202526; color: #f1f4f2; }
    main { display: grid; grid-template-rows: 54px 1fr auto; min-width: 0; background: #0e1011; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border-bottom: 1px solid #202425; font-size: 13px; }
    .thread { width: min(760px, calc(100% - 40px)); margin: auto; color: #a9b0ae; font-size: 14px; line-height: 1.7; }
    .message { width: 72%; margin-bottom: 24px; }
    .message.user { margin-left: auto; padding: 12px 14px; border-radius: 8px; background: #1b2021; color: #e7ebe9; }
    .composer-wrap { width: min(800px, calc(100% - 36px)); margin: 0 auto 18px; }
    .composer-surface-chrome { min-height: 112px; padding: 14px; border: 1px solid #303637; border-radius: 8px; background: #171b1c; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .ProseMirror { min-height: 52px; outline: none; color: #edf1ef; font-size: 14px; }
    .composer-footer { display: flex; justify-content: space-between; color: #727b78; font-size: 11px; }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="logo">Codex</div>
      <div class="nav"><div class="active">CoTypeX</div><div>Local tasks</div><div>Settings</div></div>
    </aside>
    <main class="main-surface">
      <header><span>CoTypeX interface test</span><span>Local</span></header>
      <div class="thread thread-scroll-container" role="main">
        <div class="message user">请把打字练习放到输入框内部。</div>
        <div class="message">练习界面将复用输入框位置，不读取对话内容，也不会向网络发送练习统计。</div>
      </div>
      <div class="composer-wrap">
        <div class="composer-surface-chrome">
          <div class="ProseMirror" role="textbox" contenteditable="true"></div>
          <div class="composer-footer"><span>Local</span><span>Send</span></div>
        </div>
      </div>
    </main>
  </div>
  <script src="../../dist/cotypex.user.js"></script>
</body>
</html>

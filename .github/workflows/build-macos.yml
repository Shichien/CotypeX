name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build universal macOS package
        run: bash scripts/build-macos-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CoTypeX-macos-universal
          path: |
            release/CoTypeX-*-macos-universal/
            release/CoTypeX-*-macos-universal.zip
          if-no-files-found: error

[package]
name = "cotypex"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "A typing-practice layer injected into the Codex desktop composer"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = "0.28"
url = "2.5"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
